[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "IGEL-custom-inventory-generator"
version = "1.0.0"
description = "Custom rocket emission inventory generator"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
IGEL_custom_inventory_generator = "IGEL_custom_inventory_generator.IGEL_custom_inventory_generator:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]