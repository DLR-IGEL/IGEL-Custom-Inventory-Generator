metadata:
  config_version: "1.0"
  inventory_name: "IGEL custom inventory example"
  institution: "German Aerospace Center (DLR)"
  creator_name: "Example User"
  creator_email: "user@example.org"
  project: "IGEL"

input_data:
  # Paths are resolved from the current working directory.
  launch_list: examples/minimal_input/Launch_List.csv
  propellant_use_profiles_dir: examples/minimal_input/Propellant_Use_Profiles
  engine_data_dir: examples/minimal_input/Engine_Data

output:
  directory: output
  run_name: minimal_example
  overwrite: true
  export_individual_profiles: true
  # Allowed values:
  #   mass
  #   molecules
  #   molecule_rate
  #   molecule_rate_per_volume
  inventory_emission_unit: mass
  # Allowed values: altitude, pressure
  inventory_vertical_coordinate: altitude
  # Allowed values: single_file, per_timestep_files
  inventory_netcdf_mode: single_file

processing:
  # Allowed values: CSVEM, null
  post_combustion: null
  # Positive integer followed by d (days), w (weeks), or m (months).
  time_resolution: "1d"

domain:
  altitude_min_km: 0
  altitude_max_km: 1
  latitude_min_deg: -1
  latitude_max_deg: 1
  longitude_min_deg: -1
  longitude_max_deg: 1
  inclusive: true
  # Allowed values: discard, include_at_top_layer
  emissions_above_inventory: discard

grid:
  altitude_resolution_km: 1
  latitude_resolution_deg: 1
  longitude_resolution_deg: 1

time_range:
  start_date: "01-01-2024"
  end_date: "01-01-2024"
